[project]
name = "wholesalebench"
version = "0.0.1"
description = "WholesaleBench: synthetic produce-wholesale world for evaluating delayed-consequence decision quality"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "duckdb==1.4.1",
    "openpyxl==3.1.5",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "lxml==6.0.2",
    "numpy==2.5.3",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
