# Static source metadata. File-level facts (paths, checksums, retrieval times)
# come from registry/raw_manifest.jsonl; `python -m wsb.register` merges both
# into registry/source_register.csv.
#
# inspection_level:
#   documentation_reviewed | sample_inspected | full_data_processed | not_located | blocked
# counts_basis: computed (by our code, see reports/<source>/profile.json) | publisher_reported

- source_id: usda_ams_legacy_txt
  publisher: USDA Agricultural Marketing Service, Specialty Crops Market News
  url: https://www.ams.usda.gov/market-news/fruit-and-vegetable-terminal-markets-standard-reports
  version: frozen pre-MARS text reports (last issues 2024-01-03 / 2024-01-10)
  license: US government work, not subject to copyright (17 U.S.C. 105)
  license_evidence: statute; AMS site-specific statement not located on fetch
  format: fixed-width text
  source_grain: price quote per market x date x commodity x package x origin x descriptor
  coverage: 10 terminal markets, fv010-fv040 (fruit, vegetables, onions/potatoes, ornamentals); 40 of 46 listed ids served as .txt (as_fv010-030 and ra_fv010-030 returned 404)
  provenance: empirical (market offering quotes, not transactions)
  inspection_level: full_data_processed
  counts_basis: computed
  role: produce package units, quality/size spreads, winter price levels
  access_note: MARS API (structured history) returns 403 without a free API key; user chose keyless-only for this pass

- source_id: usda_ams_wayback_bh_fv020
  publisher: USDA AMS (content); Internet Archive Wayback Machine (capture)
  url: https://web.archive.org/web/*/www.ams.usda.gov/mnreports/bh_fv020.txt
  version: one file per distinct capture (CDX collapse=digest)
  license: US government work (17 U.S.C. 105); retrieval via Internet Archive terms of use
  license_evidence: statute
  format: fixed-width text
  source_grain: as above, Boston terminal vegetables only
  coverage: 119 distinct captures, 117 report dates 1999-2023 (irregular); not a daily series
  provenance: empirical
  inspection_level: full_data_processed
  counts_basis: computed
  role: seasonal price ranges and glut magnitudes for one market

- source_id: usda_ams_current_pdf
  publisher: USDA AMS (MARS era)
  url: https://www.ams.usda.gov/mnreports/bh_fv020.pdf
  version: current issue at retrieval time
  license: US government work (17 U.S.C. 105)
  license_evidence: statute
  format: pdf
  source_grain: price quote
  coverage: one day
  provenance: empirical
  inspection_level: documentation_reviewed
  counts_basis: none
  role: format evidence for MARS-era reports only; not parsed

- source_id: freshretailnet_50k
  publisher: Dingdong Inc. (Hugging Face Dingdong-Inc/FreshRetailNet-50K)
  url: https://huggingface.co/datasets/Dingdong-Inc/FreshRetailNet-50K
  version: HF commit 08c1fab7f9257bc73679d415d65d644165d351d4 (card says v1.0, 2025-05-08)
  license: CC BY 4.0
  license_evidence: dataset card YAML + "License/Terms of Use" section (data/raw/freshretailnet_50k/README.md)
  format: parquet
  source_grain: store x product x day with 24 hourly sales + stock-status slots
  coverage: 50,000 series, 898 stores, 865 SKUs, 18 cities; 2024-03-28..2024-07-02
  provenance: empirical, normalized by undisclosed coefficient
  inspection_level: full_data_processed
  counts_basis: computed
  role: unit-free customer demand shape (variability, weekday, stockout incidence)

- source_id: uci_online_retail_ii
  publisher: UCI Machine Learning Repository (Daqing Chen)
  url: https://archive.ics.uci.edu/dataset/502/online+retail+ii
  version: DOI 10.24432/C5CG6D; static zip
  license: CC BY 4.0
  license_evidence: UCI dataset page
  format: xlsx (2 sheets) in zip
  source_grain: invoice line
  coverage: 2009-12-01..2011-12-09; UK online giftware retailer, many wholesale customers
  provenance: empirical
  inspection_level: full_data_processed
  counts_basis: computed
  role: structural analog for order cadence, basket size, pack multiples, cancellations/credits, write-offs, bad-debt entries

- source_id: wide_world_importers
  publisher: Microsoft (sql-server-samples)
  url: https://github.com/microsoft/sql-server-samples/releases/tag/wide-world-importers-v1.0
  version: WideWorldImporters-Standard.bacpac (release 2016-06-08; package exported 2022-10-07)
  license: MIT (repository license.txt); database content license not separately stated
  license_evidence: https://github.com/microsoft/sql-server-samples/blob/master/license.txt
  format: bacpac (zip of DacFx model.xml + BCP native data)
  source_grain: relational OLTP schema
  coverage: 48 tables; 4,713,833 rows (publisher_reported in Origin.xml)
  provenance: synthetic (generated by Microsoft workload simulator)
  inspection_level: documentation_reviewed
  counts_basis: publisher_reported
  role: schema scaffold only (PO ordered vs received outers, case packs, payment days, credit limits, credit notes, stock ledger); rows NOT inspected (SQL Server unavailable on aarch64, no amd64 emulation)

